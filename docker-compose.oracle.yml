# Override pra produção num VPS com domínio próprio (ex. Oracle Cloud
# Always Free). Soma HTTPS automático (Caddy + Let's Encrypt) ao
# docker-compose.public-site.yml -- não modifica web/worker, só adiciona o
# proxy na frente. Ver lodout/public_site/README.md, seção "Deploy".
#
# Uso:
#   SITE_DOMAIN=seudominio.com docker compose \
#     -f docker-compose.public-site.yml -f docker-compose.oracle.yml \
#     up --build -d
services:
  web:
    environment:
      - LODOUT_PUBLIC_SITE_SECURE_COOKIES=1

  # Catálogo amplo (plans/archive/catalogo-grande.md): só em produção. Para
  # desligar, troque por 0 e faça deploy com [restart-worker].
  worker:
    environment:
      - LODOUT_CATALOGO=1
      # Inventário das contas 1x por dia (plans/archive/conta-inventario.md).
      - LODOUT_INVENTARIO_DIARIO=1

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
