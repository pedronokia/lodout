{# "Vendi" (revisão 29, 16/11): janela com unidades, quanto o comprador
   pagou e a conta ao vivo. conta.js preenche a partir do <details
   data-vendi> da linha; sem JavaScript, o formulário abre na linha. #}
<dialog class="dialogo-confirmar dialogo-vendi" id="dialogo-vendi" aria-labelledby="dialogo-vendi-titulo" aria-describedby="dialogo-vendi-texto">
  <form method="post" class="dialogo-conteudo" data-janela-vendi-form>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="lote" value="" data-janela-vendi-lote>
    <h2 class="dialogo-titulo" id="dialogo-vendi-titulo">Vendeu <span data-janela-vendi-nome translate="no"></span>?</h2>
    <p class="dialogo-texto" id="dialogo-vendi-texto">Ele sai da sua lista e vai para “Itens vendidos”, no Histórico, com o lucro.</p>
    <div class="dialogo-campos">
      <label class="dialogo-campo" data-janela-vendi-qtd-campo>
        <span class="dialogo-campo-rotulo">Unidades vendidas</span>
        <span class="dialogo-campo-linha"><input type="number" name="quantidade" min="1" value="1" inputmode="numeric" class="input-compacto input-quantidade" data-janela-vendi-qtd> <span class="dialogo-campo-sufixo" data-janela-vendi-de></span></span>
      </label>
      <label class="dialogo-campo">
        <span class="dialogo-campo-rotulo">O comprador pagou</span>
        <span class="dialogo-campo-linha"><span class="campo-reais"><span class="campo-reais-prefixo" aria-hidden="true">R$</span><input type="text" name="sell_price" inputmode="decimal" required maxlength="12" autocomplete="off" class="input-compacto input-venda" aria-describedby="dialogo-vendi-dica" data-janela-vendi-preco></span> <span class="dialogo-campo-sufixo">cada</span></span>
        <span class="dialogo-dica" id="dialogo-vendi-dica">Já vem o preço de hoje. Corrija se vendeu por outro valor.</span>
      </label>
    </div>
    <p class="dialogo-conta" data-janela-vendi-conta aria-live="polite"></p>
    <div class="dialogo-acoes">
      <button type="button" class="botao-secundario" data-janela-vendi-cancelar>Cancelar</button>
      <button type="submit" class="botao-acao">Confirmar venda</button>
    </div>
  </form>
</dialog>
