{% from "partials/_icons.html" import icone %}
<nav class="subnav-conta" aria-label="Navegação da conta">
  <a href="{{ url_for('account.conta') }}"{% if request.endpoint == 'account.conta' %} aria-current="page"{% endif %} class="subnav-conta-link{{ ' subnav-conta-ativo' if request.endpoint == 'account.conta' else '' }}">
    {{ icone("caixa") }}
    <span>Inventário</span>
  </a>
  <a href="{{ url_for('watchlist.listar') }}"{% if request.endpoint in ('watchlist.listar', 'watchlist.listar_favoritos') %} aria-current="page"{% endif %} class="subnav-conta-link{{ ' subnav-conta-ativo' if request.endpoint in ('watchlist.listar', 'watchlist.listar_favoritos') else '' }}">
    {{ icone("favorito") }}
    <span>Favoritos</span>
  </a>
  <a href="{{ url_for('history.listar') }}"{% if request.endpoint == 'history.listar' %} aria-current="page"{% endif %} class="subnav-conta-link{{ ' subnav-conta-ativo' if request.endpoint == 'history.listar' else '' }}">
    {{ icone("grafico") }}
    <span>Histórico</span>
  </a>
</nav>
