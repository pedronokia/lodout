<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Devagar aí — Lodout</title>
  <link rel="icon" href="{{ static_v('favicon.svg') }}">
  <link rel="stylesheet" href="{{ static_v('style.css') }}">
</head>
<body>
  <a class="link-pular-conteudo" href="#conteudo">Pular pro conteúdo</a>
  <header class="topo">
    <div class="topo-linha">
      <div class="titulo-logo">{% include "partials/_logo.html" %}</div>
    </div>
  </header>

  <main id="conteudo" class="pagina-texto">
    <header class="cabecalho-pagina">
      <h1 class="titulo-pagina">Devagar aí</h1>
      <p class="descricao-pagina">Foram muitos pedidos em pouco tempo. Para
      evitar abuso, cada página tem um limite por minuto. Espere um minuto e
      tente de novo.</p>
    </header>
    <div class="acoes-erro">
      <a class="botao-acao" href="{{ request.path if request.method == 'GET' else url_for('index') }}">Tentar de novo</a>
      <a class="acao-texto" href="{{ url_for('index') }}">Ir para a página inicial</a>
    </div>
  </main>

  <footer class="rodape">
    <p class="versao">Lodout</p>
    {% include "partials/_rodape_links.html" %}
  </footer>
</body>
</html>
