name: deploy

# Roda só DEPOIS que o workflow "tests" (tests.yml) passar em push pra
# main -- nunca deploya código que não passou na suite. Também pode ser
# acionado manualmente via workflow_dispatch (ex.: reiniciar worker/caddy
# ou forçar rebuild sem precisar de commit vazio).
#
# Secrets necessários no repositório (Settings → Secrets and variables → Actions):
#   ORACLE_HOST       -- IP ou domínio da VM (ex. pedronokia.duckdns.org)
#   ORACLE_SSH_KEY    -- conteúdo do arquivo .key baixado na criação da VM
#   SITE_DOMAIN       -- domínio público servido pelo Caddy (ex. lodout.com)
# Opcionais:
#   ADMIN_DISCORD_WEBHOOK -- URL do webhook do Discord do DONO pros alertas
#                            do worker (atraso, scan degradado, disco).
#   ADMIN_PASSWORD        -- senha do /admin (12+ caracteres). Sem ela, o
#                            /admin devolve 404.
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      restart_worker:
        description: "Reiniciar o serviço worker após validar o site"
        type: boolean
        default: false
      restart_caddy:
        description: "Recriar o container do Caddy (reler Caddyfile)"
        type: boolean
        default: false
      force_rebuild:
        description: "Forçar docker build mesmo sem mudança em Dockerfile/requirements"
        type: boolean
        default: false

# Princípio do menor privilégio: este workflow só lê o repo para rodar o
# smoke test pós-deploy (nenhum step escreve no GitHub).
permissions:
  contents: read

# Um deploy por vez: dois pushes seguidos disparavam dois deploys
# simultâneos e o segundo `docker compose up` falhava com "container
# name already in use" (2026-11-13). Em fila, o último sempre vence.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    # Em workflow_run, exige tests com sucesso vindos de push pra main
    # (um workflow_dispatch de tests pra regerar baselines NÃO é deploy).
    # Em workflow_dispatch direto neste workflow, executa sempre.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout do commit deployado (para smoke test)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy web (+ Caddy se pedido) e limpeza na VM
        id: deploy_web
        uses: appleboy/ssh-action@v1.2.5
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          ADMIN_DISCORD_WEBHOOK: ${{ secrets.ADMIN_DISCORD_WEBHOOK }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RESTART_CADDY: ${{ inputs.restart_caddy == true || contains(github.event.workflow_run.head_commit.message, '[restart-caddy]') }}
          FORCE_REBUILD: ${{ inputs.force_rebuild == true || contains(github.event.workflow_run.head_commit.message, '[rebuild]') }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: opc
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: SITE_DOMAIN,ADMIN_DISCORD_WEBHOOK,ADMIN_PASSWORD,RESTART_CADDY,FORCE_REBUILD
          script: |
            set -euo pipefail
            cd ~/skinvault
            # Mantém o remote apontando pro nome atual do repo (idempotente).
            git remote set-url origin "$(git remote get-url origin | sed -E 's#pedronokia/(skinvault|galaseca)#pedronokia/lodout#')"
            if git remote get-url origin | grep -q 'pedronokia/lodout'; then
              echo "remote da VM: pedronokia/lodout"
            fi

            # fetch + reset --hard (nunca "pull"): evita divergência na VM.
            # Guarda o SHA anterior fora do repo para rollback automático caso
            # /readyz ou smoke_test falhem após a troca.
            git fetch origin
            PREV_SHA="$(git rev-parse HEAD)"
            TARGET_SHA="$(git rev-parse origin/main)"
            if [ "$PREV_SHA" != "$TARGET_SHA" ]; then
              printf '%s\n' "$PREV_SHA" > "$HOME/.lodout-prev-sha"
            fi
            git reset --hard origin/main
            git clean -fd

            # Como ./lodout é montado via bind mount (:ro), só reconstruímos a
            # imagem Docker quando alguma entrada de build mudou (ou [rebuild]).
            # A gravação do carimbo só acontece após o compose subir com sucesso.
            BUILD_HASH=$(sha256sum Dockerfile.public-site requirements-public-site.txt entrypoint.sh scripts/minify_static.py | sha256sum | awk '{print $1}')
            STAMP_FILE="$HOME/.lodout-web-build.sha256"
            BUILD_FLAG=""
            if [ "${FORCE_REBUILD:-false}" = "true" ] \
               || [ ! -f "$STAMP_FILE" ] \
               || [ "$(cat "$STAMP_FILE")" != "$BUILD_HASH" ]; then
              echo "Reconstruindo imagem Docker do web..."
              BUILD_FLAG="--build"
            else
              echo "Imagem Docker inalterada — deploy rápido via bind mount."
            fi

            BUILD_ID="$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
            SITE_DOMAIN="${SITE_DOMAIN:-}" \
              LODOUT_ADMIN_DISCORD_WEBHOOK="${ADMIN_DISCORD_WEBHOOK:-}" \
              LODOUT_ADMIN_PASSWORD="${ADMIN_PASSWORD:-}" \
              LODOUT_BUILD_ID="$BUILD_ID" \
              sudo -E docker compose \
              -f docker-compose.public-site.yml -f docker-compose.oracle.yml \
              up $BUILD_FLAG -d --force-recreate web
            printf '%s\n' "$BUILD_HASH" > "$STAMP_FILE"

            # Recria o Caddy antes do smoke test quando solicitado.
            if [ "${RESTART_CADDY:-false}" = "true" ]; then
              echo "Recriando container do Caddy..."
              SITE_DOMAIN="${SITE_DOMAIN:-}" \
                LODOUT_ADMIN_DISCORD_WEBHOOK="${ADMIN_DISCORD_WEBHOOK:-}" \
                LODOUT_ADMIN_PASSWORD="${ADMIN_PASSWORD:-}" \
                sudo -E docker compose \
                -f docker-compose.public-site.yml -f docker-compose.oracle.yml \
                up -d --force-recreate caddy
            fi

            # Limpa imagens/cache Docker antigos (>7 dias) pra evitar disco cheio na VM.
            sudo docker image prune -f --filter "until=168h" || true
            sudo docker builder prune -f --filter "until=168h" || true
            df -h /

      - name: Confirma que o site subiu (/readyz)
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
        run: |
          set -euo pipefail
          dominio="${SITE_DOMAIN:-lodout.com}"
          # Até ~60s: cobre recriação do Caddy ou emissão inicial de certificado.
          for i in $(seq 1 12); do
            sleep 5
            if curl -sf "https://${dominio}/readyz" | grep -q '"ready": *true'; then
              echo "OK: https://${dominio}/readyz respondeu ready=true"
              exit 0
            fi
          done
          echo "FALHOU: https://${dominio}/readyz não respondeu como esperado"
          exit 1

      - name: Smoke test pós-deploy nas rotas principais
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Executa scripts/smoke_test.py
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
        run: |
          set -euo pipefail
          python -m pip install --quiet httpx
          dominio="${SITE_DOMAIN:-lodout.com}"
          python scripts/smoke_test.py "https://${dominio}"

      - name: Rollback automático do web em caso de falha na validação
        if: ${{ failure() && steps.deploy_web.outcome == 'success' }}
        uses: appleboy/ssh-action@v1.2.5
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          ADMIN_DISCORD_WEBHOOK: ${{ secrets.ADMIN_DISCORD_WEBHOOK }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: opc
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: SITE_DOMAIN,ADMIN_DISCORD_WEBHOOK,ADMIN_PASSWORD
          script: |
            set -euo pipefail
            cd ~/skinvault
            PREV_FILE="$HOME/.lodout-prev-sha"
            if [ ! -f "$PREV_FILE" ]; then
              echo "Sem SHA anterior salvo para rollback."
              exit 0
            fi
            PREV_SHA="$(cat "$PREV_FILE")"
            CUR_SHA="$(git rev-parse HEAD)"
            if [ -z "$PREV_SHA" ] || [ "$PREV_SHA" = "$CUR_SHA" ]; then
              echo "HEAD já está no SHA anterior ($CUR_SHA); nada a reverter."
              exit 0
            fi
            git cat-file -e "${PREV_SHA}^{commit}"
            echo "Revertendo web de ${CUR_SHA:0:7} para ${PREV_SHA:0:7}..."
            git reset --hard "$PREV_SHA"
            git clean -fd

            BUILD_HASH=$(sha256sum Dockerfile.public-site requirements-public-site.txt entrypoint.sh scripts/minify_static.py | sha256sum | awk '{print $1}')
            STAMP_FILE="$HOME/.lodout-web-build.sha256"
            BUILD_FLAG=""
            if [ ! -f "$STAMP_FILE" ] || [ "$(cat "$STAMP_FILE")" != "$BUILD_HASH" ]; then
              BUILD_FLAG="--build"
            fi

            SITE_DOMAIN="${SITE_DOMAIN:-}" \
              LODOUT_ADMIN_DISCORD_WEBHOOK="${ADMIN_DISCORD_WEBHOOK:-}" \
              LODOUT_ADMIN_PASSWORD="${ADMIN_PASSWORD:-}" \
              LODOUT_BUILD_ID="rollback-${PREV_SHA:0:7}" \
              sudo -E docker compose \
              -f docker-compose.public-site.yml -f docker-compose.oracle.yml \
              up $BUILD_FLAG -d --force-recreate web
            printf '%s\n' "$BUILD_HASH" > "$STAMP_FILE"
            echo "Rollback concluído para ${PREV_SHA:0:7}."

      - name: Avisa no Discord se o deploy falhou
        if: ${{ failure() && steps.deploy_web.outcome == 'success' }}
        env:
          ADMIN_DISCORD_WEBHOOK: ${{ secrets.ADMIN_DISCORD_WEBHOOK }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python3 -c '
          import json, os, urllib.request
          url = os.environ.get("ADMIN_DISCORD_WEBHOOK", "").strip()
          if not url:
              raise SystemExit(0)
          sha = os.environ["COMMIT_SHA"][:7]
          msg = f"🚨 Lodout: deploy do commit `{sha}` falhou em /readyz ou smoke_test e o web foi revertido automaticamente para a versão anterior."
          req = urllib.request.Request(
              url,
              data=json.dumps({"content": msg}).encode("utf-8"),
              method="POST",
              headers={"Content-Type": "application/json", "User-Agent": "Lodout-Deploy/1.0"},
          )
          urllib.request.urlopen(req, timeout=5)
          ' || true

      - name: Atualiza o worker quando solicitado
        if: ${{ inputs.restart_worker == true || contains(github.event.workflow_run.head_commit.message, '[restart-worker]') }}
        uses: appleboy/ssh-action@v1.2.5
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          ADMIN_DISCORD_WEBHOOK: ${{ secrets.ADMIN_DISCORD_WEBHOOK }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          FORCE_REBUILD: ${{ inputs.force_rebuild == true || contains(github.event.workflow_run.head_commit.message, '[rebuild]') }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: opc
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: SITE_DOMAIN,ADMIN_DISCORD_WEBHOOK,ADMIN_PASSWORD,FORCE_REBUILD
          script: |
            set -euo pipefail
            cd ~/skinvault
            # Ao subir, o worker espera o próximo ciclo (conta do último
            # registrado); só escaneia na hora se o ciclo já estiver atrasado.
            BUILD_HASH=$(sha256sum Dockerfile.public-site requirements-public-site.txt entrypoint.sh scripts/minify_static.py | sha256sum | awk '{print $1}')
            STAMP_FILE="$HOME/.lodout-worker-build.sha256"
            BUILD_FLAG=""
            if [ "${FORCE_REBUILD:-false}" = "true" ] \
               || [ ! -f "$STAMP_FILE" ] \
               || [ "$(cat "$STAMP_FILE")" != "$BUILD_HASH" ]; then
              echo "Reconstruindo imagem Docker do worker..."
              BUILD_FLAG="--build"
            else
              echo "Imagem Docker inalterada — recriando worker via bind mount."
            fi

            SITE_DOMAIN="${SITE_DOMAIN:-}" \
              LODOUT_ADMIN_DISCORD_WEBHOOK="${ADMIN_DISCORD_WEBHOOK:-}" \
              LODOUT_ADMIN_PASSWORD="${ADMIN_PASSWORD:-}" \
              sudo -E docker compose \
              -f docker-compose.public-site.yml -f docker-compose.oracle.yml \
              up $BUILD_FLAG -d --force-recreate worker
            printf '%s\n' "$BUILD_HASH" > "$STAMP_FILE"
