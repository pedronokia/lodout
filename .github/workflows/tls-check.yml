name: tls-check

# Roda 1x por dia e falha (vermelho na aba Actions, GitHub pode avisar
# por e-mail) se o certificado TLS do site estiver a menos de 14 dias
# de expirar -- o Caddy renova sozinho (ver README), mas "renova
# sozinho" não é "nunca falha". Reaproveita o secret SITE_DOMAIN que o
# deploy.yml já usa; não precisa de SSH nem de nenhum secret novo.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Confere validade do certificado TLS
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
        run: |
          set -euo pipefail
          dominio="${SITE_DOMAIN:-lodout.com}"
          python3 scripts/check_tls_expiry.py "${dominio}" 14
