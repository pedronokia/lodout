name: gerar-og-image-temp

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-public-site.txt
      - run: python -m pip install -r requirements-public-site.txt
      - run: python scripts/gerar_og_image.py
      - uses: actions/upload-artifact@v7
        with:
          name: og-image-linux
          path: lodout/public_site/static/og-image.png
