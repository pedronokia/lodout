# Atualizações automáticas semanais de dependências e segurança.
# Agrupadas por ecossistema pra evitar enxurrada de PRs pequenos.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      python-runtime:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/tests/visual"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    # A imagem roda a mesma versão do Python que a CI testa (tests.yml).
    # Trocar de versão (3.12 -> 3.13...) é decisão manual, feita junto com
    # a matriz da CI; aqui só entram os patches da imagem 3.12-slim.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
